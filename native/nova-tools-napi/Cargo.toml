[package]
name = "nova-tools-napi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bincode = "1.3"
chrono = "0.4"
napi = { version = "2", features = ["napi8", "serde-json"] }
napi-derive = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
aho-corasick = "1"
ignore = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
