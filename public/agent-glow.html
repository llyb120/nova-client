<!doctype html>
<meta charset="utf-8">
<!-- 剑来操作桌面时的边缘呼吸光效。窗口排除在截图外且鼠标穿透，见 src-tauri/src/agent_glow.rs -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  .screen { position: fixed; overflow: hidden; pointer-events: none; }
  .screen i { position: absolute; inset: 0; will-change: opacity; animation: 3.2s ease-in-out infinite alternate; }
  /* 贴边的细光线：始终在，呼气时略暗 */
  .edge { box-shadow: inset 0 0 0 1.5px rgba(125, 211, 252, .9), inset 0 0 14px 2px rgba(56, 189, 248, .7); animation-name: edge; }
  /* 向内弥散的柔光：吸气时铺开，留足中间区域不挡用户看内容 */
  .halo { box-shadow: inset 0 0 48px 10px rgba(56, 189, 248, .42), inset 0 0 120px 28px rgba(14, 165, 233, .18); animation-name: halo; }
  @keyframes edge { from { opacity: 1 } to { opacity: .55 } }
  @keyframes halo { from { opacity: .15 } to { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .screen i { animation: none; opacity: .8 } }
</style>
<script>
  // s=x,y,w,h,...：每块屏相对本窗口左上角的物理像素
  function draw() {
    const n = (new URLSearchParams(location.search).get("s") || "").split(",").map(Number);
    const r = devicePixelRatio || 1;
    document.body.replaceChildren(...Array.from({ length: n.length / 4 | 0 }, (_, i) => {
      const [x, y, w, h] = n.slice(i * 4, i * 4 + 4).map(v => v / r);
      const screen = document.createElement("div");
      screen.className = "screen";
      Object.assign(screen.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
      screen.innerHTML = '<i class="halo"></i><i class="edge"></i>';
      return screen;
    }));
  }
  addEventListener("DOMContentLoaded", draw);
  addEventListener("resize", draw);
</script>
