name: Polaris dependency-prune latency
on:
  push:
    branches: [perf/polaris-semantic-20260919]
    paths:
      - .github/workflows/polaris-dependency-prune.yml
      - scripts/polaris-dependency-prune-migrate.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: polaris-dependency-prune-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with:
          ref: 3da28d30f1adfd0da3b993813a47aa3fff20fdeb
          path: _corpus
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: polaris-working-set-cover-candidate
          run-id: 35491881474
          github-token: ${{ github.token }}
          path: _current
      - uses: actions/download-artifact@v4
        with:
          name: polaris-one-shot-results
          run-id: 35483102649
          github-token: ${{ github.token }}
          path: _accepted
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: bench/polaris-harness -> target
          cache-on-failure: true
      - name: Apply exact production candidate
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y ripgrep
          mkdir -p validation .cargo
          printf '[net]\ngit-fetch-with-cli = true\n' > .cargo/config.toml
          python scripts/polaris-dependency-prune-migrate.py
          git diff -- src-tauri/src/nova_tools_native > validation/production.patch
          git diff --exit-code -- src-tauri/src/lyra/reasonix.rs src-tauri/src/nova_tools_native/context.rs
          git rev-parse HEAD > validation/tested-base.txt
      - name: Production retrieval regressions and fresh binary
        run: |
          set -euo pipefail
          cargo clean --release --manifest-path bench/polaris-harness/Cargo.toml -p polaris-harness
          cargo test --release --manifest-path bench/polaris-harness/Cargo.toml -- --test-threads=1 2>&1 | tee validation/rust-tests.txt
          node --test scripts/polaris-query.test.mjs scripts/nova-tools-mcp.test.mjs scripts/ctx-core.test.mjs 2>&1 | tee validation/node-tests.txt
          cargo build --release --manifest-path bench/polaris-harness/Cargo.toml
          mkdir -p validation/bin validation/source
          cp bench/polaris-harness/target/release/polaris-harness validation/bin/candidate
          cp src-tauri/src/nova_tools_native/polaris*.rs validation/source/
          sha256sum validation/bin/candidate > validation/candidate-binary.sha256
          sha256sum src-tauri/src/nova_tools_native/polaris*.rs src-tauri/src/lyra/reasonix.rs > validation/source-hashes.txt
      - name: Same-run 20/20 quality and latency comparison
        run: |
          set -euo pipefail
          test "$(sha256sum _current/bin/candidate | cut -d' ' -f1)" = "b9a550f4c211e7d8b34dd5d3738be18ec2b987f29366f0f6c6f0f7d24258cf2c"
          chmod +x _current/bin/candidate
          python scripts/polaris-working-set-cover-ab.py             --current _current/bin/candidate             --candidate validation/bin/candidate             --accepted _accepted             --corpus _corpus | tee validation/dependency-prune-progress.txt
          python scripts/polaris-one-shot-edit.py --binary validation/bin/candidate | tee validation/context-only-edit.txt
          python - <<'PY'
          import json,pathlib,re,statistics
          root=pathlib.Path('validation/working-set-cover')
          report=json.loads((root/'report.json').read_text())
          edit=json.loads(pathlib.Path('validation/context-only-edit/report.json').read_text())
          assert report['passed'] is True,report['checks']
          assert edit['passed']==edit['total']==4,edit
          def demand(arm):
              rows=[]
              for p in (root/'raw').glob(f'*/{arm}-cold.txt'):
                  t=p.read_text(errors='ignore')
                  m=re.search(r'^# retrieval: (\{.*\})$',t,re.M)
                  if not m: continue
                  d=json.loads(m.group(1)).get('demand',{})
                  if d.get('parsedFiles') is not None: rows.append(d)
              return rows
          old,new=demand('current'),demand('candidate')
          assert len(old)>=20 and len(new)>=20,(len(old),len(new))
          metrics={
            'current':{'parsedFilesP50':statistics.median(x['parsedFiles'] for x in old),'parseMsP50':statistics.median(x['parseMs'] for x in old)},
            'candidate':{'parsedFilesP50':statistics.median(x['parsedFiles'] for x in new),'parseMsP50':statistics.median(x['parseMs'] for x in new)},
          }
          # Require a real reduction, not runner noise, while quality gates remain exact.
          metrics['passed']=metrics['candidate']['parsedFilesP50']<=metrics['current']['parsedFilesP50'] and metrics['candidate']['parseMsP50']<=metrics['current']['parseMsP50']*0.97
          pathlib.Path('validation/dependency-prune-metrics.json').write_text(json.dumps(metrics,indent=2))
          print(json.dumps(metrics,indent=2))
          assert metrics['passed'],metrics
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-dependency-prune-candidate
          path: validation/
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: bench/polaris-harness -> target
          cache-on-failure: true
      - run: choco install ripgrep -y --no-progress
      - name: Apply and test same source
        run: |
          set -euo pipefail
          mkdir -p validation .cargo
          printf '[net]\ngit-fetch-with-cli = true\n' > .cargo/config.toml
          python scripts/polaris-dependency-prune-migrate.py
          cargo test --release --manifest-path bench/polaris-harness/Cargo.toml -- --test-threads=1 2>&1 | tee validation/rust-tests.txt
          node --test scripts/polaris-query.test.mjs scripts/nova-tools-mcp.test.mjs scripts/ctx-core.test.mjs 2>&1 | tee validation/node-tests.txt
          sha256sum src-tauri/src/nova_tools_native/polaris*.rs src-tauri/src/lyra/reasonix.rs > validation/source-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-dependency-prune-windows
          path: validation/
          retention-days: 7
  land:
    needs: [candidate, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.sha }} }
      - uses: actions/download-artifact@v4
        with:
          name: polaris-dependency-prune-candidate
          path: _verified
      - name: Land exact verified production file only
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/perf/polaris-semantic-20260919 | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo 'Branch changed; refusing overwrite'; exit 1; }
          python - <<'PY'
          import pathlib,json,subprocess
          r=pathlib.Path('_verified')
          assert (r/'tested-base.txt').read_text().strip()==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          metrics=json.loads((r/'dependency-prune-metrics.json').read_text());assert metrics['passed']
          report=json.loads((r/'working-set-cover/report.json').read_text());assert report['passed']
          patch=r/'production.patch'
          paths={line.split(' b/',1)[1] for line in patch.read_text().splitlines() if line.startswith('diff --git ')}
          assert paths=={'src-tauri/src/nova_tools_native/polaris_demand_v2.rs'},paths
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git rm scripts/polaris-dependency-prune-migrate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(polaris): skip impossible dependency files before syntax parsing'
          git push origin HEAD:perf/polaris-semantic-20260919
          mkdir -p validation
          git rev-parse HEAD > validation/landed-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-dependency-prune-landed
          path: validation/
          retention-days: 7
