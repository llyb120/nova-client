name: Operator CI

on:
  push:
    branches: [work/operator-fast-tools]

concurrency:
  group: operator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - shell: bash
        run: |
          mkdir -p .cargo
          printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libclang-dev
      - run: npm run check
      - run: npm run test:operator
      - run: npm run build:sdk-bridges
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib operator::tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib lyra::agent::tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib lyra::tools::embedded_rtk_tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib acp::desktop_prompt_tests
