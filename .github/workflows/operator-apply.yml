name: Apply operator source patch
on:
  push:
    branches: [work/operator-adaptive-pre-release-20260920]
    paths: [.github/workflows/operator-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'llyb120/nova-client' && github.ref == 'refs/heads/work/operator-adaptive-pre-release-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact six-file followup
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3da28d30f1adfd0da3b993813a47aa3fff20fdeb HEAD
          python - <<'PY'
          import base64, hashlib, pathlib, re, zlib
          names = ['final-1.b64', 'final-2a.b64', 'final-2b.b64']
          text = ''.join((pathlib.Path('.operator-stage') / n).read_text().strip() for n in names)
          patch = zlib.decompress(base64.b64decode(text, validate=True))
          actual = hashlib.sha256(patch).hexdigest()
          assert actual == '88ca6f623f49237d2a4e79d762b63af5512f2e555e47ce87b18913c3344912e7', actual
          expected = {'bench/operator-replay/src/main.rs', 'src-tauri/src/acp.rs', 'src-tauri/src/acp/operator.rs', 'src-tauri/src/lyra/bridge.rs', 'src-tauri/src/operator/core.rs', 'src-tauri/src/operator/mod.rs'}
          assert set(re.findall(r'^\+\+\+ b/(.+)$', patch.decode(), re.M)) == expected
          pathlib.Path('/tmp/operator-followup.patch').write_bytes(patch)
          print('verified bytes:', len(patch), 'sha256:', actual)
          PY
          git apply --check /tmp/operator-followup.patch
          git apply /tmp/operator-followup.patch
          rm -rf .operator-stage
          git add src-tauri bench .operator-stage
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(operator): account child usage exactly once and use production contracts in replay'
          git push origin HEAD:work/operator-adaptive-pre-release-20260920
