name: Operator implementation validation
on:
  push:
    branches: [work/operator-context-20260919]
    paths: [.operator-transfer.b64]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed transfer patch
        run: |
          python3 - <<'PY'
          import base64,gzip,pathlib,subprocess
          patch=gzip.decompress(base64.b64decode(pathlib.Path('.operator-transfer.b64').read_text(),validate=True))
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path=line[6:]
                  assert path.startswith(('src-tauri/src/','scripts/','bench/operator-harness/','docs/operator')) and '..' not in path.split('/'), path
          pathlib.Path('/tmp/operator.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/operator.patch'],check=True)
          subprocess.run(['git','apply','/tmp/operator.patch'],check=True)
          PY
      - name: Commit feature changes
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .operator-transfer.b64
          git add src-tauri/src scripts bench/operator-harness
          test ! -d docs/operator || git add docs/operator
          git commit -m 'feat: isolate Operator context and inherit active session model without settings'
          git push origin HEAD:work/operator-context-20260919
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  unit:
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          mkdir -p .cargo
          printf '[net]\ngit-fetch-with-cli = true\n' > .cargo/config.toml
          mkdir -p validation
      - name: Node regression tests
        run: node --test scripts/operator.test.mjs scripts/nova-tools-mcp.test.mjs scripts/ctx-core.test.mjs | tee validation/node-tests.tap
      - name: Compile production state machine and runtime, run fixtures
        run: cargo test --manifest-path bench/operator-harness/Cargo.toml -- --test-threads=1 2>&1 | tee validation/rust-tests.txt
      - name: Deterministic footprint A/B (not a real-model benchmark)
        run: cargo run --quiet --manifest-path bench/operator-harness/Cargo.toml > validation/operator-ab.json
      - name: Source format check
        if: always()
        run: |
          rustfmt --edition 2021 src-tauri/src/operator/*.rs
          git diff -- src-tauri/src/operator > validation/operator-format.patch
          cp "$(rustup which rustfmt)" validation/rustfmt
          git rev-parse HEAD > validation/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-validation
          path: validation/
          retention-days: 7
  compile:
    needs: apply
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: |
          printf '[net]\ngit-fetch-with-cli = true\n' > .cargo/config.toml
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libclang-dev
      - run: npm ci
      - run: npm run build:sdk-bridges && npm run check
      - name: Compile native application
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee native-compile.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-native-compile
          path: native-compile.txt
          retention-days: 7
