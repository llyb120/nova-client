name: Operator Backtest

on:
  push:
    branches:
      - feat/operator-simple-fast

concurrency:
  group: operator-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Use crates.io
        shell: bash
        run: |
          mkdir -p .cargo
          printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend deps
        run: npm ci
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libclang-dev
      - name: Build SDK bridges
        run: npm run build:sdk-bridges
      - name: Typecheck
        run: npm run check
      - name: Operator Node tests
        run: node --test scripts/operator-tools.test.mjs scripts/nova-tools-mcp.test.mjs scripts/automation-schema.test.mjs scripts/browser-precision.test.mjs extensions/nova-chrome/worker.test.mjs
      - name: Three-way architectural backtest
        run: node scripts/operator-backtest.mjs | tee operator-backtest.json
      - name: Rust operator tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib operator::tests -- --nocapture
      - name: Rust compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-backtest
          path: operator-backtest.json
          if-no-files-found: warn
