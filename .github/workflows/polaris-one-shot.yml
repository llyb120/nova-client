name: Polaris one-shot working sets
on:
  push:
    branches: [perf/polaris-semantic-20260919]
    paths: [.github/workflows/polaris-one-shot.yml, scripts/polaris-connected-packet.py, scripts/polaris-required-callers.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: polaris-one-shot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3da28d30f1adfd0da3b993813a47aa3fff20fdeb
          path: _corpus
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 22e3cf0fb55537ca6c93b68126c2c737794d783d
          path: _replay
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sanitized-native-gui-replay-results
          path: _report
          run-id: 35448033036
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: polaris-ubuntu-24.04
          path: _oldbin
          run-id: 35434961064
          github-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: bench/polaris-harness -> target
          cache-on-failure: true
      - name: Authenticate frozen engine and apply reviewed candidate
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y ripgrep
          mkdir -p validation/bin validation/source validation/scripts .cargo
          printf '[net]\ngit-fetch-with-cli = true\n' > .cargo/config.toml
          cp _oldbin/bench/polaris-harness/target/release/polaris-harness validation/bin/previous
          chmod +x validation/bin/previous
          echo 'ef1896343d43926775c4c28923ffd0e981584069b327b750b04c8144502e6537  validation/bin/previous' | sha256sum --check
          for script in polaris-one-shot-migrate polaris-one-shot-refine polaris-context-closure polaris-shallow-closure polaris-precision-budget polaris-coverage-balance polaris-source-edges polaris-working-set-guidance polaris-connected-packet polaris-required-callers; do
            python3 "scripts/$script.py"
          done
          git diff -- src-tauri/src/nova_tools_native src-tauri/src/lyra/tools.rs scripts/ctx-core.mjs scripts/polaris-query.mjs scripts/polaris-one-shot-edit.py > validation/production.patch
          git diff --exit-code -- src-tauri/src/lyra/reasonix.rs
          git rev-parse HEAD > validation/base-commit.txt
          cp src-tauri/src/nova_tools_native/polaris*.rs validation/source/
          cp src-tauri/src/lyra/tools.rs validation/source/lyra-tools.rs
          cp scripts/polaris-*.py scripts/polaris-query.mjs scripts/ctx-core.mjs validation/scripts/
          sha256sum src-tauri/src/nova_tools_native/polaris*.rs src-tauri/src/nova_tools_native/context.rs src-tauri/src/lyra/reasonix.rs src-tauri/src/lyra/tools.rs scripts/polaris-query.mjs scripts/ctx-core.mjs > validation/source-hashes.txt
          git -C _corpus archive HEAD src src-tauri/src scripts .gitignore | gzip > validation/corpus-source.tar.gz
      - name: Production regression tests and fresh release build
        id: build
        run: |
          set -euo pipefail
          cargo clean --release --manifest-path bench/polaris-harness/Cargo.toml -p polaris-harness
          cargo test --release --manifest-path bench/polaris-harness/Cargo.toml -- --test-threads=1 2>&1 | tee validation/rust-tests.txt
          node --test scripts/polaris-query.test.mjs scripts/nova-tools-mcp.test.mjs scripts/ctx-core.test.mjs 2>&1 | tee validation/node-tests.txt
          cargo build --release --manifest-path bench/polaris-harness/Cargo.toml
          cp bench/polaris-harness/target/release/polaris-harness validation/bin/candidate
          sha256sum validation/bin/* > validation/binary-hashes.txt
          ! cmp -s validation/bin/previous validation/bin/candidate
      - name: Preserve frozen replay exclusion rules
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('_replay')
          for p in root.rglob('*'):
              rel=p.relative_to(root)
              if '.git' in rel.parts or not p.is_file():continue
              if rel.parts[0] in ('bench','.github') or re.search(r'report|eval|replay|ab-results|cases\.json',str(rel),re.I):p.unlink()
          PY
      - name: One context call then compile and edit, without supplemental reads
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/polaris-one-shot-edit.py --binary validation/bin/candidate | tee validation/context-only-edit-progress.txt
      - name: Cold start and equal-budget implementation plus dependency coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/polaris-fastcontext-ab.py --previous "$GITHUB_WORKSPACE/validation/bin/previous" --candidate "$GITHUB_WORKSPACE/validation/bin/candidate" --corpus _corpus --replay-corpus _replay --replay-report _report/35447590732/polaris/report.json | tee validation/progress.txt
      - name: Scaling and identical-mtime freshness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/polaris-fastcontext-scale.py --previous "$GITHUB_WORKSPACE/validation/bin/previous" --candidate "$GITHUB_WORKSPACE/validation/bin/candidate" | tee validation/scale-progress.txt
      - name: Explicit coverage and latency acceptance, not only process exit codes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('validation')
          r=json.loads((root/'fastcontext/report.json').read_text())
          edit=json.loads((root/'context-only-edit/report.json').read_text())
          summary=r['summary'];b=summary['regression']['pr11'];c=summary['regression']['demand'];closure=summary['closure']['demand']['cold']
          checks={
            'all_queries_returned':all(row['ok'] for row in r['rows']),
            'fixed_core_coverage_no_regression':c['cold']['coreBody']>=b['cold']['coreBody'],
            'fixed_top1_no_regression':c['cold']['top1']>=b['cold']['top1'],
            'four_required_closures':closure['allRequired']==4,
            'four_context_only_edits':edit['passed']==edit['total']==4,
            'cold_p50_under_650ms':c['cold']['p50Ms']<=650,
            'warm_p50_under_80ms':c['warm']['p50Ms']<=80,
          }
          report={'passed':all(checks.values()),'checks':checks,'scope':'Known regression corpus and deterministic edits; not general LLM accuracy.'}
          (root/'acceptance.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          raise SystemExit(0 if report['passed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-one-shot-results
          path: validation/
          retention-days: 7
