name: Terminal appearance regression
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: /usr/bin/google-chrome
          - os: windows-latest
            browser: C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_SCREENSHOT: terminal-appearance-${{ matrix.os }}.png
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2b5f3e034040ca6ac2eb86e1c727de4e3d619844
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run check 2>&1 | tee typecheck.log
      - name: Terminal shortcuts, theme and output stability regressions
        run: npm run test:terminal 2>&1 | tee terminal-tests.log
      - name: Existing workspace regression
        run: node scripts/workspace-panel.test.mjs 2>&1 | tee workspace-tests.log
      - name: Production frontend build
        run: npm run build 2>&1 | tee frontend-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-appearance-${{ matrix.os }}
          path: |
            terminal-appearance-*.png
            typecheck.log
            terminal-tests.log
            workspace-tests.log
            frontend-build.log
