name: Windows terminal final acceptance
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d15724b3c998e184f3ca13f80f6570473e744d8e
      - name: Make the output sentinel independent of narrow terminal wrapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/windows-terminal-smoke.mjs');s=p.read_text(encoding='utf-8')
          old='const marker = `nova-native-${randomUUID()}`;'
          assert s.count(old)==1
          s=s.replace(old,'// A short random sentinel still proves real shell output without depending on column width.\nconst marker = `nova-native-${randomUUID().slice(0, 8)}`;')
          s=s.replace('// Windows-only end-to-end test. Build the debug app first; no IPC or PTY mocks.', '// Windows-only end-to-end test; no IPC or PTY mocks.\n// Build a debug test copy with app.windows[0].additionalBrowserArgs set to\n// "--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1".\n// Never enable that debugging port in distributed builds.')
          s=s.replace('let server, app, browser, page;', 'let server, app, browser, page, connectionError;')
          s=s.replace('} catch { /* WebView2 is still starting. */ }', '} catch (error) { connectionError = String(error); }')
          s=s.replace("assert.ok(browser, 'WebView2 did not start its debugging endpoint');", "assert.ok(browser, 'WebView2 debugging connection failed: ' + connectionError);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final test candidate
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/windows-terminal-smoke.mjs
          git diff --cached --check
          git commit -m 'test(windows): make real shell output assertions independent of terminal width'
          git push origin HEAD:fix/windows-terminal-20260918
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  frontend:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --check scripts/windows-terminal-smoke.mjs
      - run: node scripts/terminal-shortcuts.test.mjs
      - run: node scripts/workspace-terminal.test.mjs
      - run: node scripts/workspace-panel.test.mjs
      - run: npm run build
  native:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          ref: 4a26f50f32357d76b9b124fd2be9204c65ae1947
          path: _ci
      - name: Use crates.io
        shell: bash
        run: printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:sdk-bridges:release
      - name: Enable loopback debugging in CI build only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          config=json.loads(p.read_text(encoding='utf-8'))
          config['app']['windows'][0]['additionalBrowserArgs']='--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1'
          p.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Build actual desktop executable
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin nova 2>&1 | tee windows-terminal-build.log
      - name: Real CMD, Windows PowerShell and PowerShell 7
        shell: bash
        env:
          TEST_WINDOWS_DIAGNOSTICS: _ci/.github/windows-terminal-diagnostics.ps1
        run: node scripts/windows-terminal-smoke.mjs 2>&1 | tee windows-terminal-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-terminal-final-acceptance
          path: |
            windows-terminal-*.json
            windows-terminal-*.log
            windows-terminal-*.png
