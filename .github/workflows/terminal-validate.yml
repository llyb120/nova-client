name: Precision tools full acceptance
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32b502baa6c1948f18fb0a760e92a9d324021d8b
          path: staging
      - uses: actions/checkout@v4
        with:
          ref: 3bb760c652a450424a8e0b64e0d97fd2bbef1378
          path: source
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed acceptance checks
        working-directory: source
        run: |
          python ../staging/.github/precision-tools/finalize.py
          rustfmt --edition 2021 src-tauri/src/browser_pixels.rs src-tauri/src/visual_guard.rs
      - name: Commit candidate
        id: commit
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/native-browser-smoke.mjs scripts/chrome-tool.json scripts/webview-tool.json src-tauri/src/jianlai.rs src-tauri/src/native_browser.rs src-tauri/src/browser_pixels.rs src-tauri/src/visual_guard.rs
          git diff --cached --check
          git commit -m 'test(tools): verify focus-safety and real desktop pixel witnesses'
          git push origin HEAD:fix/precision-tools-20260918
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  frontend:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TEST_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Browser targeting and same-run performance comparison
        shell: bash
        run: |
          git show 9798b86d66b8b7b8822c3d26a92cf838d6efb03d:src-tauri/src/native_browser_page.js > /tmp/browser-page-before.js
          BROWSER_BASELINE=/tmp/browser-page-before.js node scripts/browser-targeting.test.mjs 2>&1 | tee browser-targeting.log
      - name: Extension and MCP regressions
        run: node --test extensions/nova-chrome/worker.test.mjs scripts/nova-tools-mcp.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-browser-regression
          path: |
            browser-targeting-report.json
            browser-targeting.log
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive
      - name: Use crates.io
        run: printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:sdk-bridges:release
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libpipewire-0.3-dev libxcb-randr0-dev libgbm-dev
      - name: Native input, coordinate and pixel witness tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib native_browser:: -- --nocapture 2>&1 | tee native-browser-tests.log
          cargo test --manifest-path src-tauri/Cargo.toml --lib jianlai:: -- --nocapture 2>&1 | tee jianlai-tests.log
          cargo test --manifest-path src-tauri/Cargo.toml --lib chrome_browser:: -- --nocapture 2>&1 | tee chrome-tests.log
      - name: Real Jianlai monitor crop and mouse-position guards
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib jianlai::tests::desktop_smoke -- --ignored --exact --nocapture 2>&1 | tee jianlai-desktop-tests.log
      - name: Enable separate debug drivers in isolated Windows build only
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json');config=json.loads(p.read_text(encoding='utf-8'))
          config['app']['windows'][0]['additionalBrowserArgs']='--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --disable-features=CalculateNativeWinOcclusion'
          p.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('src-tauri/src/native_browser.rs');s=p.read_text(encoding='utf-8')
          old='.data_directory(state_dir(app).join("native-browser-profile"))'
          assert s.count(old)==1
          s=s.replace(old,old+'\n        .additional_browser_args("--remote-debugging-port=9223 --remote-debugging-address=127.0.0.1 --disable-features=CalculateNativeWinOcclusion")')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Windows native executable
        if: runner.os == 'Windows'
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin nova 2>&1 | tee native-browser-build.log
      - name: Real Windows WebView2 and Chrome-transport integration
        if: runner.os == 'Windows'
        env:
          TEST_CDP_PORT: '9222'
          TEST_CHILD_CDP_PORT: '9223'
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort > vite.log 2>&1 &
          node scripts/native-browser-smoke.mjs src-tauri/target/debug/nova.exe 2>&1 | tee native-browser-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-native-${{ runner.os }}
          path: |
            *-tests.log
            native-browser-build.log
            native-browser-smoke.log
            vite.log
            src-tauri/target/native-browser-smoke/
