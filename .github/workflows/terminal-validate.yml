name: Terminal runtime regression and Windows desktop
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdc49a09d3ef034934bf1ff61764c8ca1409c22a
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: 0b07b5b41a049e0939598338072ef0eac2dfc94c
          path: source
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed runtime fixes
        working-directory: source
        run: |
          python ../ci/.github/terminal-runtime-fix.py
          rustfmt --edition 2021 src-tauri/build.rs src-tauri/src/workspace_terminal.rs
      - name: Commit fix candidate
        id: commit
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/build.rs src-tauri/src/workspace_terminal.rs src/terminalSessions.ts scripts/workspace-terminal.test.mjs
          git diff --cached --check
          git commit -m 'fix(terminal): decouple input readiness and complete ConPTY shutdown handshake'
          git push origin HEAD:fix/windows-terminal-20260918
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-fix-source
          path: |
            source/src-tauri/build.rs
            source/src-tauri/src/workspace_terminal.rs
            source/src/terminalSessions.ts
            source/scripts/workspace-terminal.test.mjs
            source/scripts/windows-terminal-smoke.mjs
  frontend:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node scripts/terminal-shortcuts.test.mjs
      - run: node scripts/workspace-terminal.test.mjs
        env:
          TEST_SCREENSHOT: terminal-regression.png
      - run: node scripts/workspace-panel.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-frontend-regression
          path: terminal-regression.png
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive
      - name: Use crates.io
        shell: bash
        run: printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:sdk-bridges:release
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libpipewire-0.3-dev libxcb-randr0-dev
      - name: Native terminal tests
        id: tests
        continue-on-error: true
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib workspace_terminal::tests -- --nocapture 2>&1 | tee native-terminal-tests.log
      - name: Build real desktop executable
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin nova 2>&1 | tee windows-terminal-build.log
      - name: Real WebView2 terminal interaction
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/windows-terminal-smoke.mjs 2>&1 | tee windows-terminal-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-native-${{ runner.os }}
          path: |
            native-terminal-tests.log
            windows-terminal-*.json
            windows-terminal-*.log
            windows-terminal-*.png
      - name: Require native tests to pass
        if: always() && steps.tests.outcome != 'success'
        shell: bash
        run: exit 1
