name: Precision native COM acceptance
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a3ff4f2d987a5249348ff3b47b8382f61c6dfcf3
          path: staging
      - uses: actions/checkout@v4
        with:
          ref: 2b2a80bdb3a2f4d13e02dd18b7aec9c9fd68c0da
          path: source
      - name: Prepare isolated test driver
        working-directory: source
        run: python ../staging/.github/precision-tools/native-driver.py
      - name: Commit test support only
        id: commit
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/native-browser-smoke.mjs
          git diff --cached --check
          git commit -m 'test(browser): allow isolated native COM fixture inspection'
          git push origin HEAD:fix/precision-tools-20260918
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  native:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive
      - name: Use crates.io
        run: printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:sdk-bridges:release
      - name: Instrument isolated CI build only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json');config=json.loads(p.read_text(encoding='utf-8'))
          config['app']['windows'][0]['additionalBrowserArgs']='--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --disable-features=CalculateNativeWinOcclusion'
          p.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('src-tauri/src/native_browser.rs')
          s=p.read_text(encoding='utf-8')
          s+='\n#[tauri::command]\npub async fn precision_smoke_cdp(app:AppHandle,label:String,method:String,params:Value,session_id:Option<String>)->Result<Value,String>{\n CONTROL_TAB.scope(label,native_cdp(&app,&method,params,session_id.as_deref(),None)).await\n}\n'
          p.write_text(s,encoding='utf-8')
          p=Path('src-tauri/src/lib.rs');s=p.read_text(encoding='utf-8')
          old='native_browser::native_browser_ui,'
          assert s.count(old)==1
          p.write_text(s.replace(old,old+'\n            native_browser::precision_smoke_cdp,'),encoding='utf-8')
          PY
      - name: Windows native executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin nova 2>&1 | tee native-browser-build.log
      - name: Real WebView2 and Chrome-transport integration
        env:
          TEST_CDP_PORT: '9222'
          TEST_NATIVE_CDP_DRIVER: '1'
        run: |
          node --check scripts/native-browser-smoke.mjs
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort > vite.log 2>&1 &
          node scripts/native-browser-smoke.mjs src-tauri/target/debug/nova.exe 2>&1 | tee native-browser-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precision-native-Windows
          path: |
            native-browser-build.log
            native-browser-smoke.log
            vite.log
            src-tauri/target/native-browser-smoke/
