name: Terminal platform acceptance
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a26f50f32357d76b9b124fd2be9204c65ae1947
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: a5feaddb5ad77d301c8420b2664cb843db6967b6
          path: source
      - name: Refine native shell smoke assertions
        working-directory: source
        run: python ../ci/.github/terminal-smoke-fix.py
      - name: Commit candidate
        id: commit
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/windows-terminal-smoke.mjs
          git diff --cached --check
          git commit -m 'test(terminal): use real Enter input and shell-independent tab selectors'
          git push origin HEAD:fix/windows-terminal-20260918
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  frontend:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node scripts/terminal-shortcuts.test.mjs
      - run: node scripts/workspace-terminal.test.mjs
      - run: node scripts/workspace-panel.test.mjs
      - run: npm run build
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive
      - uses: actions/checkout@v4
        if: runner.os == 'Windows'
        with:
          ref: 4a26f50f32357d76b9b124fd2be9204c65ae1947
          path: _ci
      - name: Use crates.io
        shell: bash
        run: printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:sdk-bridges:release
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libpipewire-0.3-dev libxcb-randr0-dev libgbm-dev
      - name: Native terminal tests
        id: tests
        continue-on-error: true
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib workspace_terminal::tests -- --nocapture 2>&1 | tee native-terminal-tests.log
      - name: Build desktop executable
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin nova 2>&1 | tee windows-terminal-build.log
      - name: Inspect executable manifest and installed runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mt = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter mt.exe -Recurse | Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $mt -nologo '-inputresource:src-tauri/target/debug/nova.exe;#1' '-out:windows-terminal-app.manifest'
          Get-Content windows-terminal-app.manifest
          foreach ($root in @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")) { Get-ChildItem $root -Directory -ErrorAction SilentlyContinue | Select-Object FullName }
          exit 0
      - name: Real WebView2 terminal interaction
        if: runner.os == 'Windows'
        shell: bash
        env:
          TEST_WINDOWS_DIAGNOSTICS: _ci/.github/windows-terminal-diagnostics.ps1
        run: node scripts/windows-terminal-smoke.mjs 2>&1 | tee windows-terminal-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-native-${{ runner.os }}
          path: |
            native-terminal-tests.log
            windows-terminal-*.json
            windows-terminal-*.log
            windows-terminal-*.png
            windows-terminal-*.manifest
      - name: Require native tests to pass
        if: always() && steps.tests.outcome != 'success'
        shell: bash
        run: exit 1
