name: Windows terminal real desktop validation
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b07b5b41a049e0939598338072ef0eac2dfc94c
          submodules: recursive
      - name: Use crates.io
        shell: bash
        run: printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:sdk-bridges:release
      - name: Native terminal tests
        id: tests
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib workspace_terminal::tests -- --nocapture
      - name: Build real desktop executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin nova
      - name: Real WebView2 terminal interaction
        run: node scripts/windows-terminal-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-terminal-real-desktop
          path: |
            windows-terminal-*.json
            windows-terminal-*.log
            windows-terminal-*.png
      - name: Require native tests to pass
        if: always() && steps.tests.outcome != 'success'
        run: throw 'Native terminal regression failed'
