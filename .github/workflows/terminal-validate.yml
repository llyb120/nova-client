name: Windows terminal runtime validation
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 00327bfd57c1a94b50073f1ef8be082ba3054e97
          submodules: recursive
      - name: Use crates.io
        shell: bash
        run: printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:sdk-bridges:release
      - name: Compile native terminal tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib workspace_terminal::tests --no-run
      - name: Use matching MSVC runtime beside the test executable
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $redistRoot = Join-Path $vs 'VC\Redist\MSVC'
          $crt = Get-ChildItem $redistRoot -Directory -Recurse | Where-Object { $_.Name -match '^Microsoft\.VC.*\.CRT$' -and $_.Parent.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw "MSVC x64 CRT not found under $redistRoot" }
          Write-Host "Using CRT from $($crt.FullName)"
          $destinations = @('src-tauri/target/debug/deps', 'src-tauri/target/debug')
          foreach ($destination in $destinations) {
            New-Item -ItemType Directory -Force $destination | Out-Null
            Get-ChildItem $crt.FullName -Filter '*.dll' | ForEach-Object {
              Write-Host "$($_.Name) $($_.VersionInfo.FileVersion) -> $destination"
              Copy-Item $_.FullName $destination -Force
            }
          }
      - name: Real PTY lifecycle tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib workspace_terminal::tests -- --nocapture
      - name: Loader diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/debug/deps -Filter '*.dll' | ForEach-Object { Write-Host "$($_.Name) $($_.VersionInfo.FileVersion)" }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-20); Level=2} -ErrorAction SilentlyContinue | Select-Object -First 6 TimeCreated,Id,Message | Format-List
