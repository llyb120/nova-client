name: Windows desktop terminal acceptance
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d15724b3c998e184f3ca13f80f6570473e744d8e
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          ref: 4a26f50f32357d76b9b124fd2be9204c65ae1947
          path: _ci
      - name: Use crates.io
        shell: bash
        run: printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:sdk-bridges:release
      - name: Enable loopback debugging in CI build only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json')
          config=json.loads(p.read_text(encoding='utf-8'))
          config['app']['windows'][0]['additionalBrowserArgs']='--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1'
          p.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('_ci/.github/windows-terminal-diagnostics.ps1')
          p.write_text(p.read_text(encoding='utf-8')+"\nGet-CimInstance Win32_Process | Where-Object { $_.Name -eq 'msedgewebview2.exe' } | Select-Object ProcessId,CommandLine | Format-List\n",encoding='utf-8')
          p=Path('scripts/windows-terminal-smoke.mjs');s=p.read_text(encoding='utf-8')
          s=s.replace('let server, app, browser, page;', 'let server, app, browser, page, connectionError;')
          s=s.replace('} catch { /* WebView2 is still starting. */ }', '} catch (error) { connectionError=String(error); }')
          s=s.replace("assert.ok(browser, 'WebView2 did not start its debugging endpoint');", "assert.ok(browser, 'WebView2 debugging connection failed: ' + connectionError);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build desktop executable
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin nova 2>&1 | tee windows-terminal-build.log
      - name: Real WebView2 terminal interaction
        shell: bash
        env:
          TEST_WINDOWS_DIAGNOSTICS: _ci/.github/windows-terminal-diagnostics.ps1
        run: node scripts/windows-terminal-smoke.mjs 2>&1 | tee windows-terminal-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-native-Windows
          path: |
            windows-terminal-*.json
            windows-terminal-*.log
            windows-terminal-*.png
