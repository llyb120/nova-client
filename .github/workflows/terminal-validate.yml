name: Chrome precision complete acceptance
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae82e9b0139596d6adc12c7f6875381fa7219706
          path: staging
      - uses: actions/checkout@v4
        with:
          ref: 8c96f0036f58a448f78c287b241bc89ae69d341e
          path: source
      - name: Initialize Chrome fixture and retain the original WebView smoke driver
        working-directory: source
        run: |
          python ../staging/.github/precision-tools/chrome-smoke-setup.py
          git fetch --depth=1 origin 9798b86d66b8b7b8822c3d26a92cf838d6efb03d
          git restore --source=FETCH_HEAD -- scripts/native-browser-smoke.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tool-precision.yml');s=p.read_text()
          s=s.replace("      - 'scripts/browser-targeting.test.mjs'", "      - 'scripts/browser-targeting.test.mjs'\n      - 'scripts/chrome-precision-smoke.mjs'")
          s=s.replace('      - run: npm run check','      - run: npm run check\n      - run: node --check scripts/chrome-precision-smoke.mjs')
          p.write_text(s)
          PY
      - name: Commit test preparation
        id: commit
        working-directory: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/chrome-precision-smoke.mjs scripts/native-browser-smoke.mjs .github/workflows/tool-precision.yml
          git diff --cached --check
          git commit -m 'test(chrome): initialize fixture thread and preserve existing WebView driver'
          git push origin HEAD:fix/precision-tools-20260918
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  chrome:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive
      - name: Use crates.io
        run: printf '%s\n' '[net]' 'git-fetch-with-cli = true' > .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:sdk-bridges:release
      - name: Enable main-window test driver in isolated build only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('src-tauri/tauri.conf.json');config=json.loads(p.read_text(encoding='utf-8'))
          config['app']['windows'][0]['additionalBrowserArgs']='--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --disable-features=CalculateNativeWinOcclusion'
          p.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Build real Nova executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin nova 2>&1 | tee precision-build.log
      - name: Actual Chrome, Rust tool, trusted input and Canvas checks
        env:
          TEST_CDP_PORT: '9222'
          TEST_CHROME_PORT: '9333'
        run: |
          node --check scripts/chrome-precision-smoke.mjs
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort > precision-vite.log 2>&1 &
          node scripts/chrome-precision-smoke.mjs src-tauri/target/debug/nova.exe 2>&1 | tee precision-chrome-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-precision-native-acceptance
          path: |
            precision-*.log
            src-tauri/target/chrome-precision-smoke/
