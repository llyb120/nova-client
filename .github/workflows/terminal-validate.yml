name: Terminal frontend validation
on:
  push:
    branches: [work/terminal-build-20260918]
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/terminal-implementation-20260918
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Make resize regression independent of incidental event counts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/workspace-terminal.test.mjs')
          s=p.read_text()
          s=s.replace("  await page.setViewportSize({width:1000,height:640});\n  await page.waitForFunction(()=>window.termTest.resized.length>5);", """  const beforeResize=await page.evaluate(()=>({count:window.termTest.resized.length,id:window.termTest.id(),last:window.termTest.resized.filter(s=>s.id===window.termTest.id()).at(-1)}));
            await page.setViewportSize({width:1000,height:640});
            await page.waitForFunction(before=>window.termTest.resized.slice(before.count).some(s=>s.id===before.id&&(s.cols!==before.last.cols||s.rows!==before.last.rows)),beforeResize);""")
          s=s.replace('let server,browser;', 'let server,browser,page;').replace('const page=await browser.newPage(', 'page=await browser.newPage(')
          s=s.replace('} finally { await browser?.close();', "} finally { if(process.env.TEST_SCREENSHOT&&page)await page.screenshot({path:process.env.TEST_SCREENSHOT}).catch(()=>{}); await browser?.close();")
          p.write_text(s)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and conversation regressions
        run: |
          npm run check
          node scripts/terminal-shortcuts.test.mjs
          node scripts/virgo-shortcut.test.mjs
          node --experimental-strip-types scripts/thread-display.test.mjs
          node --experimental-strip-types scripts/virgo-chains.test.mjs
      - name: Terminal browser interaction
        env:
          TEST_BROWSER: /usr/bin/google-chrome
          TEST_SCREENSHOT: terminal-ui.png
        run: node scripts/workspace-terminal.test.mjs
      - name: Existing workspace regression
        env:
          TEST_BROWSER: /usr/bin/google-chrome
        run: node scripts/workspace-panel.test.mjs
      - name: Production frontend build
        run: npm run build
      - name: Commit verified regression test
        run: |
          git config user.name 'llyb120'
          git config user.email 'llyb120@users.noreply.github.com'
          git add scripts/workspace-terminal.test.mjs
          git diff --cached --check
          git commit -m 'test: assert real terminal resize instead of incidental callback counts'
          git push origin HEAD:refs/heads/work/terminal-implementation-20260918
          echo "Verified frontend: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git archive --format=tar.gz -o "$RUNNER_TEMP/terminal-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-ui
          path: terminal-ui.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: terminal-source
          path: ${{ runner.temp }}/terminal-source.tar.gz
          retention-days: 3
