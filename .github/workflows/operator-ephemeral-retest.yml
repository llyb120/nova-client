name: Operator one-use live retest

on:
  push:
    branches: [work/operator-context-20260919]
    paths: [.github/workflows/operator-ephemeral-retest.yml]

permissions:
  contents: write

concurrency:
  group: operator-one-use-live-retest
  cancel-in-progress: false

env:
  OPERATOR_SOURCE_SHA: a4509e1dd01dd34002a58ca1853d965256083d0d
  OPERATOR_FIXTURE_SHA: 3d7ac249129e3f25c703fb03a1dd5617c3560a7a
  OPERATOR_CONTROL_SHA: bbd3c100413f39b5bdc55f5fd813dd7776ef1df3
  OPERATOR_RELAY_SHA: 15ab4ede78dbe4b96cbccba43dd04ea316300594

defaults:
  run:
    shell: bash

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPERATOR_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPERATOR_FIXTURE_SHA }}
          path: _fixture
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPERATOR_CONTROL_SHA }}
          path: _control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPERATOR_RELAY_SHA }}
          path: _relay
          persist-credentials: false
      - name: Load reviewed run blocks from the pinned relay workflow
        run: |
          cat > _relay/run-block.py <<'PY'
          import sys, subprocess
          from pathlib import Path
          text=Path('_relay/.github/workflows/operator-ephemeral-retest.yml').read_text()
          header='      - name: '+sys.argv[1]+'\n'
          assert text.count(header)==1
          block=text.split(header,1)[1].split('\n      - ',1)[0]
          script=block.split('        run: |\n',1)[1]
          lines=script.splitlines()
          assert all(not line.strip() or line.startswith('          ') for line in lines)
          script='\n'.join(line[10:] if line.strip() else '' for line in lines)+'\n'
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Publish one-use recipient public key only
        env:
          RELAY_GH_TOKEN: ${{ github.token }}
        run: python3 _relay/run-block.py 'Publish one-use recipient public key only'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Stage pinned scripts and separate transport readiness from model correctness
        run: |
          set -euo pipefail
          python3 _relay/run-block.py 'Stage original pinned retest script and audit source hashes'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/operator-post-fix-run.mjs');s=p.read_text()
          old="import {mkdir,writeFile,appendFile} from 'node:fs/promises';"
          assert s.count(old)==1
          s=s.replace(old,"import {mkdir,writeFile,appendFile,readFile} from 'node:fs/promises';")
          old="await preflight(key,'validation');"
          assert s.count(old)==1
          new="""let preflightSemanticPassed=true;
          try { await preflight(key,'validation'); }
          catch(error) {
            const p=JSON.parse(await readFile('validation/json-adapter-preflight.json','utf8'));
            let obj;try{obj=JSON.parse(p.text)}catch{}
            const transportReady=p.httpStatus===200&&p.returnedModel==='deepseek/deepseek-v4.1-flash'&&p.finishReason==='stop'&&obj&&typeof obj==='object'&&!Array.isArray(obj);
            if(!transportReady)throw error;
            preflightSemanticPassed=false;
            await save('validation/preflight-semantic-warning.json',{transportReady:true,semanticPassed:false,originalProbe:p,policy:'Diagnostic only. This synthetic preflight omits the full native tool contract; its decision is NEVER executed. All GUI decisions must still pass unchanged production parsing, action contracts and snapshot guards. No response is repaired and no task acceptance condition is weakened.'});
            console.warn('Preflight transport/JSON ready; synthetic action semantics failed and are retained. Continuing to unchanged production runtime validation.');
          }"""
          s=s.replace(old,new)
          old='const summary={status:g.status,'
          assert s.count(old)==1
          s=s.replace(old,'const summary={preflightSemanticPassed,status:g.status,')
          p.write_text(s)
          PY
          node --check scripts/operator-post-fix-run.mjs
          git diff --exit-code -- src-tauri/src
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: bench/operator-gui-harness -> target
          cache-on-failure: true
      - name: Install isolated headed browser and native dependencies
        run: python3 _relay/run-block.py 'Install isolated headed browser and native dependencies'
      - name: Compile pinned production modules and serial regression tests
        run: python3 _relay/run-block.py 'Compile pinned production modules and regression tests'
      - name: Consume one-use encrypted envelope and run real-model GUI A/B
        env:
          RELAY_GH_TOKEN: ${{ github.token }}
          OPERATOR_GUI_EXE: bench/operator-gui-harness/target/debug/nova-operator-gui-harness
        run: python3 _relay/run-block.py 'Consume one-use encrypted envelope and run real-model GUI A/B'
      - name: Always remove runner private key and sanitize retained text
        if: always()
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          private=Path(os.environ['RUNNER_TEMP'])/('operator-onetime-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'.pem')
          private.unlink(missing_ok=True)
          for p in Path('validation').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.json','.jsonl','.txt','.log','.md'}:
                  p.write_text(re.sub(r'user_[A-Za-z0-9_-]{16,}','[REDACTED]',p.read_text(errors='replace')))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operator-one-use-post-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/
          retention-days: 7
          if-no-files-found: ignore
