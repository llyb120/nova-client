name: Operator one-use live retest

on:
  push:
    branches: [work/operator-context-20260919]
    paths: [.github/workflows/operator-ephemeral-retest.yml]

permissions:
  contents: write

concurrency:
  group: operator-one-use-live-retest
  cancel-in-progress: false

env:
  OPERATOR_SOURCE_SHA: a4509e1dd01dd34002a58ca1853d965256083d0d
  OPERATOR_FIXTURE_SHA: 3d7ac249129e3f25c703fb03a1dd5617c3560a7a
  OPERATOR_CONTROL_SHA: bbd3c100413f39b5bdc55f5fd813dd7776ef1df3

defaults:
  run:
    shell: bash

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPERATOR_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPERATOR_FIXTURE_SHA }}
          path: _fixture
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPERATOR_CONTROL_SHA }}
          path: _control
          persist-credentials: false
      - name: Publish one-use recipient public key only
        env:
          RELAY_GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, json, base64, hashlib, subprocess, urllib.request
          from pathlib import Path
          run=os.environ['GITHUB_RUN_ID']; attempt=os.environ['GITHUB_RUN_ATTEMPT']
          private=Path(os.environ['RUNNER_TEMP'])/f'operator-onetime-{run}-{attempt}.pem'
          subprocess.run(['openssl','genpkey','-algorithm','RSA','-pkeyopt','rsa_keygen_bits:3072','-out',str(private)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          pub=subprocess.check_output(['openssl','pkey','-in',str(private),'-pubout']).decode()
          manifest={'runId':run,'attempt':attempt,'workflowCommit':os.environ['GITHUB_SHA'],'sourceCommit':os.environ['OPERATOR_SOURCE_SHA'],'algorithm':'RSA-OAEP-SHA256','publicKey':pub,'sha256':hashlib.sha256(pub.encode()).hexdigest()}
          path=f'.operator-onetime/{run}-{attempt}.recipient.json'
          body={'message':'test(operator): publish ephemeral public recipient [skip ci]','branch':os.environ['GITHUB_REF_NAME'],'content':base64.b64encode(json.dumps(manifest,indent=2).encode()).decode()}
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+path,data=json.dumps(body).encode(),method='PUT',headers={'Authorization':'Bearer '+os.environ['RELAY_GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r: assert r.status==201
          print('Ephemeral public recipient published; private key exists only on this runner.')
          PY
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Stage original pinned retest script and audit source hashes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          # Read only the already-reviewed run block from the pinned workflow.
          text=Path('_control/.github/workflows/operator-live-retest.yml').read_text()
          start='      - name: Stage the pinned live fixture without changing production\n        run: |\n'
          assert text.count(start)==1
          block=text.split(start,1)[1].split('\n      - uses:',1)[0]
          lines=block.splitlines()
          assert all(not line.strip() or line.startswith('          ') for line in lines)
          script='\n'.join(line[10:] if line.strip() else '' for line in lines)+'\n'
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: bench/operator-gui-harness -> target
          cache-on-failure: true
      - name: Install isolated headed browser and native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libclang-dev libxdo-dev libxtst-dev xvfb openbox dbus-x11
          npm install --prefix bench/operator-gui-deps --no-package-lock --ignore-scripts playwright@1.55.1 pngjs@7.0.0
          bench/operator-gui-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Compile pinned production modules and regression tests
        run: |
          set -euo pipefail
          cargo build --manifest-path bench/operator-gui-harness/Cargo.toml 2>&1 | tee validation/native-build.txt
          # These tests intentionally share the single global interactive-resource lease.
          cargo test --manifest-path bench/operator-gui-harness/Cargo.toml -- --test-threads=1 2>&1 | tee validation/native-unit-tests.txt
          git diff --exit-code -- src-tauri/src
      - name: Consume one-use encrypted envelope and run real-model GUI A/B
        env:
          RELAY_GH_TOKEN: ${{ github.token }}
          OPERATOR_GUI_EXE: bench/operator-gui-harness/target/debug/nova-operator-gui-harness
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,json,base64,time,re,subprocess,urllib.request,urllib.error
          from pathlib import Path
          run=os.environ['GITHUB_RUN_ID']; attempt=os.environ['GITHUB_RUN_ATTEMPT']
          private=Path(os.environ['RUNNER_TEMP'])/f'operator-onetime-{run}-{attempt}.pem'
          path=f'.operator-onetime/{run}-{attempt}.envelope.json'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/'+path+'?ref='+urllib.parse.quote(os.environ['GITHUB_REF_NAME'],safe='')
          credential=None
          try:
              deadline=time.monotonic()+600
              while time.monotonic()<deadline:
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['RELAY_GH_TOKEN'],'Accept':'application/vnd.github+json','Cache-Control':'no-cache'})
                  try:
                      with urllib.request.urlopen(req,timeout=30) as r: content=json.load(r)
                      envelope=json.loads(base64.b64decode(content['content']))
                      assert str(envelope['runId'])==run and str(envelope['attempt'])==attempt
                      assert envelope['workflowCommit']==os.environ['GITHUB_SHA']
                      cipher=base64.b64decode(envelope['ciphertext'],validate=True)
                      result=subprocess.run(['openssl','pkeyutl','-decrypt','-inkey',str(private),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-pkeyopt','rsa_mgf1_md:sha256'],input=cipher,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
                      credential=result.stdout.decode().strip()
                      assert re.fullmatch(r'user_[A-Za-z0-9_-]{16,300}',credential)
                      break
                  except urllib.error.HTTPError as e:
                      if e.code!=404: raise RuntimeError('Credential relay HTTP '+str(e.code)) from None
                      time.sleep(5)
              if credential is None: raise RuntimeError('No valid one-use envelope received before timeout')
              print('::add-mask::'+credential,flush=True)
              private.unlink(missing_ok=True)
              env=dict(os.environ)
              for name in ['RELAY_GH_TOKEN','GITHUB_TOKEN','GH_TOKEN']: env.pop(name,None)
              env['COMMAND_CODE_API_KEY']=credential
              command=['dbus-run-session','--','xvfb-run','-a','-s','-screen 0 1280x960x24','bash','-c','openbox >/tmp/operator-live-openbox.log 2>&1 & node scripts/operator-post-fix-run.mjs']
              proc=subprocess.Popen(command,env=env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              with open('validation/live-progress.txt','w') as log:
                  for line in proc.stdout:
                      line=re.sub(r'user_[A-Za-z0-9_-]{16,}','[REDACTED]',line.replace(credential,'[REDACTED]'))
                      print(line,end='',flush=True);log.write(line);log.flush()
              code=proc.wait()
              for p in Path('validation').rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.json','.jsonl','.txt','.log','.md'}:
                      text=p.read_text(errors='replace').replace(credential,'[REDACTED]')
                      p.write_text(re.sub(r'user_[A-Za-z0-9_-]{16,}','[REDACTED]',text))
              raise SystemExit(code)
          finally:
              private.unlink(missing_ok=True)
              credential=None
          PY
      - name: Always remove runner private key and sanitize retained text
        if: always()
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          private=Path(os.environ['RUNNER_TEMP'])/('operator-onetime-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'.pem')
          private.unlink(missing_ok=True)
          for p in Path('validation').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.json','.jsonl','.txt','.log','.md'}:
                  p.write_text(re.sub(r'user_[A-Za-z0-9_-]{16,}','[REDACTED]',p.read_text(errors='replace')))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operator-one-use-post-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/
          retention-days: 7
          if-no-files-found: ignore
