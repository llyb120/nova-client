name: Long-session reviewed source preparation
on:
  push:
    branches: [perf/long-image-sessions-20260918]
permissions:
  contents: read
concurrency:
  group: long-session-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed source without changing workflow permissions or definitions
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          base='0967813f8e5f56f26f72e448b9927d1f535d9ee2'
          wf='.github/workflows/long-session-regression.yml'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert all(p==wf or p.startswith('.github/history-transfer/') for p in changed),changed
          paths=sorted(pathlib.Path('.github/history-transfer').glob('part-*.b64'))
          assert len(paths)==4
          data=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in paths)))
          assert hashlib.sha256(data).hexdigest()=='148a72bc0dce3c51676fa695c99c8485c514cffe6020b74f27ee0353134b4081'
          workflow=pathlib.Path(wf)
          workflow.write_bytes(subprocess.check_output(['git','show',base+':'+wf]))
          patch=pathlib.Path('/tmp/history-ui.patch');patch.write_bytes(data)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          # GITHUB_TOKEN cannot update workflow files. Leave this file unchanged;
          # the authorized connector will separately install the final read-only CI.
          workflow.write_bytes(subprocess.check_output(['git','show','HEAD:'+wf]))
          for path in paths:path.unlink()
          subprocess.run(['git','add','-A'],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert not any(p.startswith('.github/workflows/') for p in staged)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('Verified source patch; no workflow updates in this commit.')
          PY
      - name: Publish source once to the existing development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(chat): bounded history UI, thumbnail budgets, lazy worldline and responsive controls'
          git push origin HEAD:perf/long-image-sessions-20260918
          echo "Final source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
