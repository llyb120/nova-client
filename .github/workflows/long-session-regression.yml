name: Long-session regression
on:
  push:
    branches: [perf/long-image-sessions-20260918]
permissions:
  contents: read
concurrency:
  group: long-session-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Export exact test workspace for offline continuation
        run: |
          git archive --format=tar HEAD > /tmp/long-session-source.tar
          tar -czf /tmp/long-session-dependencies.tar.gz node_modules
          gzip /tmp/long-session-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: long-session-test-workspace
          path: /tmp/long-session-*.tar.gz
          retention-days: 1
