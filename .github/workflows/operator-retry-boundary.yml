name: Operator read-only retry boundary regression
on:
  push:
    branches: [work/operator-context-20260919]
    paths: [.github/workflows/operator-retry-boundary.yml]
permissions:
  contents: write
jobs:
  prove-and-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: bench/operator-harness -> target
      - name: Reproduce the failure before changing production
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e7ee7ef4e57d42244bca4b790d3be8c765a182b5
          echo 'acc4c754cc6fc7cb81c4d3d8c25a715b9d3378380e6eb0767833e31036184b35  .github/operator-retry-regression.patch' | sha256sum -c -
          mkdir -p validation
          cp .github/operator-retry-regression.patch validation/reviewed.patch
          git apply --include=src-tauri/src/operator/latency_tests.rs .github/operator-retry-regression.patch
          if cargo test --manifest-path bench/operator-harness/Cargo.toml read_retry_drops_already_applied_evidence_claims -- --test-threads=1 > validation/before.txt 2>&1; then
            echo 'Expected reproduction did not fail'; exit 1
          fi
          grep -q 'Acceptance claim requires a current observation' validation/before.txt
          git checkout -- src-tauri/src/operator/latency_tests.rs
      - name: Apply the bounded retry fix and run all tests
        run: |
          set -euo pipefail
          git apply .github/operator-retry-regression.patch
          rustfmt --edition 2021 --config skip_children=true src-tauri/src/operator/{runtime,latency_tests}.rs
          git diff --check
          cargo test --manifest-path bench/operator-harness/Cargo.toml -- --test-threads=1 2>&1 | tee validation/after.txt
          node --test scripts/operator.test.mjs scripts/nova-tools-mcp.test.mjs scripts/ctx-core.test.mjs | tee validation/node-tests.tap
      - name: Publish the tested fix on the same PR branch
        run: |
          set -euo pipefail
          git add src-tauri/src/operator/{runtime,latency_tests}.rs
          git rm .github/operator-retry-regression.patch .github/workflows/operator-retry-boundary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(operator): retry reads without reapplying invalidated evidence claims'
          git push origin HEAD:refs/heads/work/operator-context-20260919
          git rev-parse HEAD > validation/tested-commit.txt
          git archive HEAD | gzip > validation/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-retry-boundary
          path: validation/
          retention-days: 7
