name: Land verified Polaris source only
on:
  push:
    branches: [perf/polaris-semantic-20260919]
    paths: [.github/workflows/polaris-install-one-shot.yml]
permissions:
  contents: write
  actions: read
jobs:
  land:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: polaris-one-shot-results
          run-id: 35483102649
          github-token: ${{ github.token }}
          path: _accepted
      - uses: actions/download-artifact@v4
        with:
          pattern: polaris-accepted-*
          run-id: 35483529696
          github-token: ${{ github.token }}
          path: _verified
      - name: Verify completed cross-platform jobs and byte-identical patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p validation
          python3 - <<'PY'
          import pathlib,json,hashlib,subprocess,os,urllib.request
          url='https://api.github.com/repos/llyb120/nova-client/actions/runs/35483529696/jobs?per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          for name in ['verify (ubuntu-24.04)','verify (windows-latest)']:
              job=next(j for j in data['jobs'] if j['name']==name)
              assert job['status']=='completed' and job['conclusion']=='success',name
          root=pathlib.Path('_accepted');patch=root/'production.patch'
          assert (root/'base-commit.txt').read_text().strip()=='7e52dab64de62b7bccad2f5f5e6ca9b5e5d11b45'
          assert json.loads((root/'acceptance.json').read_text())['passed'] is True
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='999b47ca72854168750d018dacd7018ca7d365608b128e9197b0900906c43a25'
          expected={name:digest for digest,name in (line.split(None,1) for line in (root/'source-hashes.txt').read_text().splitlines())}
          for name in ['polaris-accepted-ubuntu-24.04','polaris-accepted-windows-latest']:
              assert json.loads((pathlib.Path('_verified')/name/'source-hashes.json').read_text())==expected,name
          allowed={'scripts/ctx-core.mjs','scripts/polaris-one-shot-edit.py','scripts/polaris-query.mjs','src-tauri/src/lyra/tools.rs'}
          allowed.update('src-tauri/src/nova_tools_native/'+n+'.rs' for n in ['polaris','polaris_demand_v2','polaris_index','polaris_packet','polaris_query','polaris_rank','polaris_scan'])
          paths={line.split(' b/',1)[1] for line in patch.read_text().splitlines() if line.startswith('diff --git ')}
          assert paths==allowed and not any(p.startswith('.github/') for p in paths)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name,digest in expected.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          pathlib.Path('validation/verification.json').write_text(json.dumps({'verificationRun':35483529696,'acceptedRun':35483102649,'sourceHashes':expected,'modifiedPaths':sorted(paths)},indent=2))
          PY
      - name: Commit production files only and refuse concurrent changes
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = perf/polaris-semantic-20260919
          remote=$(git ls-remote origin refs/heads/perf/polaris-semantic-20260919 | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo 'Branch advanced; refusing overwrite'; exit 1; }
          git diff --exit-code -- src-tauri/src/lyra/reasonix.rs
          git diff --cached --exit-code -- .github/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(polaris): deliver query-first editable working sets with bounded dependency closure'
          git push origin HEAD:perf/polaris-semantic-20260919
          git rev-parse HEAD > validation/landed-commit.txt
          git show --stat --oneline HEAD > validation/landed-files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-landed-source
          path: validation/
          retention-days: 7
