name: GUI continuous validation

on:
  push:
    branches:
      - work/gui-continuous-actions-pre-release-20260920

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libclang-dev

      - name: Chrome continuous batch boundary
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib native_browser::tests::pixel_crop_mapping_and_action_batches_are_bounded

      - name: Jianlai continuous batch boundary
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib jianlai::tests::waits_are_not_paid_twice

      - name: Tool schema contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const file of ["scripts/chrome-tool.json", "scripts/jianlai-tool.json"]) {
            const tool = JSON.parse(fs.readFileSync(file, "utf8"));
            if (tool.inputSchema.properties.actions.maxItems !== 24) throw new Error(file + ": maxItems != 24");
            const desc = tool.inputSchema.properties.actions.description || "";
            if (!desc.includes("信息屏障") || !desc.includes("不要为了确认每个确定动作而拆批")) {
              throw new Error(file + ": missing continuity contract");
            }
            if (!tool.description.includes("操作经验是可选加速，不是必经流程")) {
              throw new Error(file + ": experience still mandatory");
            }
          }
          NODE
