[package]
name = "polaris-harness"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
wait-timeout = "0.2"
walkdir = "2"
ignore = "0.4"
bincode = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Memory", "Win32_Security"] }
[dev-dependencies]
tempfile = "3"
