[package]
name = "pi_core"
version = "0.1.0"
edition = "2021"
description = "Rust port of the deterministic core of the node pi-agent (alkaid/Vega)."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

[lib]
name = "pi_core"
crate-type = ["rlib"]
