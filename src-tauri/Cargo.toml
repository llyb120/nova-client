[package]
name = "nova"
version = "0.1.0"
description = "Nova — a Codex-style desktop client that drives ACP agents"
edition = "2021"

[lib]
name = "nova_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dunce = "1"
base64 = "0.22"
enigo = "0.6.1"
xcap = "0.9.8"
# Reuse xcap's image crate for compact screenshots and Windows clipboard DIB decoding.
image = { version = "0.25", default-features = false, features = ["jpeg", "bmp", "png", "webp"] }
flate2 = "1"
futures-util = { version = "0.3", features = ["sink"] }
# HTTP upgrade reuses reqwest's TLS/proxy stack; tungstenite handles RFC 6455 framing.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "native-tls", "blocking", "system-proxy", "socks", "stream", "multipart"] }
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# 星尘 PDF 文本提取（纯 Rust）。
pdf-extract = "0.12"
sha2 = "0.10"
# 密码本：落盘加密（AES-256-GCM）与跨机传输（X25519 密钥协商）。
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
keepawake = "0.6"
bincode = "1.3"
regex = "1"
walkdir = "2"
similar = "2"
unicode-normalization = "0.1"
aho-corasick = "1"
ignore = "0.4"
wait-timeout = "0.2"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 剑来后台操作：Linux 私有 Xvfb 座席截图；macOS 按进程投递输入事件（enigo 只能发给 HID 层）。
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra", "elcapitan"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]

tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_Globalization", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11"] }
# windows::core::implement emits absolute ::windows_core paths.
windows-core = "0.62"
tauri-winrt-notification = "0.7"
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

# 依赖不生成调试信息：显著缩短 dev/test 链接时间与 target 体积；本 crate 仍保留完整调试信息。
[profile.dev.package."*"]
debug = false

# 会话读写（JSON 序列化、SHA-256、压缩、base64）每次切会话/落盘都在热路径上；dev 下未优化会慢一个数量级。
[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.serde]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.base64]
opt-level = 3

# Keep screenshot resize/PNG/WebP processing fast in NovaDev without optimizing app code.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# Screen capture converts every BGRA pixel; unoptimized it is ~4x slower per desktop observation.
[profile.dev.package.xcap]
opt-level = 3
